<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Search - AI Ed Wiki</title>
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/@picocss/pico@1/css/pico.min.css">
    <style>
        .search-result {
            margin-bottom: 1rem;
            padding: 1rem;
            border: 1px solid var(--card-border-color);
            border-radius: 8px;
        }
        .search-result h3 { margin-top: 0; }
        .search-result .snippet {
            font-size: 0.85rem;
            color: var(--muted-color);
            margin-top: 0.3rem;
            line-height: 1.4;
            max-height: 3.5em;
            overflow: hidden;
        }
        .search-result .meta {
            font-size: 0.72rem;
            color: var(--muted-color);
            margin-top: 0.3rem;
        }
    </style>
</head>
<body>
    <header class="container">
        <nav>
            <ul>
                <li><a href="index.html">🏠 Home</a></li>
                <li><a href="journal.html">📰 Journal</a></li>
                <li><strong><a href="tags.html">🏷️ Tags</a></strong></li>
                <li><strong><a href="search.html">🔍 Search</a></strong></li>
            </ul>
        </nav>
        <h1>Search AI Ed Wiki</h1>
    </header>
    <main class="container">
        <input type="text" id="search-input" placeholder="Type to search..." style="width:100%; padding:0.75rem; margin-bottom:1rem;">
        <p id="status" style="color:var(--muted-color);"></p>
        <div id="results"></div>
    </main>

    <script src="search_index.js"></script>
    <script>
        (function() {
            var input = document.getElementById('search-input');
            var resultsDiv = document.getElementById('results');
            var status = document.getElementById('status');
            var index = window.SEARCH_INDEX;

            if (!index) {
                status.textContent = 'Error: search index failed to load.';
                return;
            }

            status.textContent = index.length + ' pages indexed. Type to search.';

            // Check for ?q= query parameter
            var params = new URLSearchParams(window.location.search);
            var q = params.get('q');
            if (q) {
                input.value = q;
                doSearch(q);
            }

            input.addEventListener('input', function(e) {
                var query = e.target.value.trim();
                if (query.length < 2) {
                    resultsDiv.innerHTML = '<p style="color:var(--muted-color);">Type at least 2 characters to search.</p>';
                    return;
                }
                doSearch(query);
            });

            function doSearch(query) {
                var q = query.toLowerCase();
                var matches = [];
                for (var i = 0; i < index.length; i++) {
                    var page = index[i];
                    var searchText = (page.title + ' ' + page.tags.join(' ') + ' ' + page.content).toLowerCase();
                    if (searchText.indexOf(q) !== -1) {
                        matches.push(page);
                    }
                }

                if (matches.length === 0) {
                    resultsDiv.innerHTML = '<p style="color:var(--muted-color);">No results found for "<strong>' + escapeHtml(query) + '</strong>".</p>';
                    return;
                }

                var html = '<p style="color:var(--muted-color);margin-bottom:1rem;">' + matches.length + ' result' + (matches.length !== 1 ? 's' : '') + ' for "<strong>' + escapeHtml(query) + '</strong>"</p>';
                for (var j = 0; j < matches.length; j++) {
                    var p = matches[j];
                    var snippet = p.content.substring(0, 250);
                    var idx = snippet.toLowerCase().indexOf(q);
                    if (idx > 30) snippet = '...' + snippet.substring(idx - 20);
                    html += '<div class="search-result">'
                        + '<h3><a href="' + p.url + '">' + p.title + '</a></h3>'
                        + '<div class="snippet">' + escapeHtml(snippet) + (p.content.length > 250 ? '...' : '') + '</div>'
                        + '<div class="meta">' + (p.tags.length ? p.tags.join(', ') : 'No tags') + '</div>'
                        + '</div>';
                }
                resultsDiv.innerHTML = html;
            }

            function escapeHtml(text) {
                var div = document.createElement('div');
                div.appendChild(document.createTextNode(text));
                return div.innerHTML;
            }
        })();
    </script>
</body>
</html>
