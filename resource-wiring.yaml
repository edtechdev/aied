  hosts:
  - accessibility
  - chemistry-education
  - edtech-platform
  - english-education
  - math-education
  - physics-education
  - science-education
  - stem-education
  reason: 'A non-profit gallery of 34 free classroom apps, most of them one subject''s tool: figure generators and practice apps for mathematics, chemistry, physics and STEM, a word-building tool for reading and writing, and special education supports. It is listed on the subject pages whose readers would use those apps and on the two pages about choosing software, not on music, vocational or humanities pages, which one app each does not justify.'
- resource: unesco-2026-integrating-ai-in-tvet-guide
  reviewed: '2026-10-28'
  hosts:
  - vocational-education
  reason: 'Listed on vocational-education, the concept the guide exists to serve: it is addressed to institutions that train skilled workers, and that page''s own questions concern AI evaluating vocational outcomes and the high-risk classification of such systems. Not listed on professional-training or higher-education pages, which are broader than the TVET scope the guide actually covers.'
- resource: okstate-ai-oer-case-studies-doers-2026
  reviewed: '2026-10-28'
  hosts:
  - open-education
  - educational-policy-ai
  - ai-literacy
  reason: 'Each host serves a reader who would use this book and neither duplicates the other. Not listed on open-source: this volume is about open educational resources and open practice, while open-source is about software and model weights, a different subject despite the shared word. The policy page needs worked examples of an institution getting from intent to published guidance, which is what the CUNY and student co-creation chapters are. The AI literacy page needs the staff development case, where a system trains teachers on Gen AI and OER at once. Not listed on change-management, whose reader is further from a chapter that documents a finished decision rather than the change effort itself.'
- resource: learnharness
  reviewed: '2026-11-02'
  hosts:
  - agentic-ai
  - intelligent-tutoring
  reason: The app is an agent harness that plans and teaches a lesson from a probed picture of the learner's understanding, so agentic-ai (which already hosts deeptutor) and intelligent-tutoring are the two concept pages whose narrative it serves; both list it in connected_resources.

- resource: learning-commons
  reviewed: '2026-11-04'
  hosts:
  - curriculum-design
  reason: The Knowledge Graph aligns generated content to academic standards and curricula, which is what the curriculum-design page argues a product has to get right; the page now lists it in connected_resources. Not listed on educational-nlp (the evaluators are a measurement layer the prose links, not an NLP method the page documents) or on open-source (the data is gated per dataset, so the page would overstate openness).
- resource: public-ai-libraries
  reviewed: '2026-11-05'
  hosts:
  - digital-divide
  - libraries
  reason: 'The kiosk is access provisioning in a public building: it gives patrons who cannot buy an AI subscription a staffed place to use one, which is the first-level access argument the digital-divide page makes, and both pages list it in connected_resources. Not listed on ai-literacy: the program ships an interactive guide and library-vetted material, but it is not a curriculum for teaching AI literacy, and the literacy page already curates ten resources aimed at that job.'
- resource: ai-tutor-pro-teaching-assistant-pro
  reviewed: '2026-11-10'
  hosts:
  - intelligent-tutoring
  reason: 'AI Tutor Pro is a free, no-signup tutoring app that a reader of the intelligent-tutoring page could hand to students today, and the page now lists it in connected_resources. Not listed on formative-assessment: the app supports practice and checking but the site reports no learning outcome evidence and the page is about assessment design, not tools. Not listed on ai-literacy: it is a place to use AI, not a curriculum for learning about it.'
- resource: teacher-hive
  reviewed: '2026-11-10'
  hosts:
  - teacher-ai-competency
  reason: 'The platform is where a teacher who has built something with an AI assistant goes next, and the competency page is where a reader thinking about what teachers should be able to do with AI would look; it now lists Teacher Hive in connected_resources. Not listed on ai-literacy: the site hosts and shares apps rather than teaching about AI, and not on professional-training: the platform offers no training or facilitation of its own.'
- resource: nowcomment
  reviewed: '2026-11-12'
  hosts:
  - collaborative-learning
  reason: 'NowComment is an annotation-and-discussion surface whose whole design is readers responding to the same passage, which is what the collaborative-learning page is about; the page now lists it in connected_resources. Not listed on peer-assessment: the tool can host peer review, but the site reports no assessment-validity evidence and the page is about judging work, not about platforms. Not listed on ai-literacy: the AI partners are a way to use an assistant inside a discussion, not a curriculum for learning about AI.'
- resource: my-essay-feedback
  reviewed: '2026-11-12'
  hosts:
  - ai-feedback-quality
  reason: 'The platform is a concrete design for the question the ai-feedback-quality page asks — what makes a generated comment usable — since instructors choose the feedback types and students must judge each suggestion in a written reflection; the page now lists it in connected_resources. Not listed on formative-assessment: the platform deliberately does not grade, and the page is about the assessment cycle rather than about feedback tools. Not listed on feedback-literacy: the reflection step teaches that literacy but the site offers no curriculum for it, and the page already curates material aimed at teaching it.'
- resource: moodle-qtype-aitext
  reviewed: '2026-11-12'
  hosts:
  - automated-essay-scoring
  reason: 'The plugin is a working implementation of instructor-written rubrics applied by an LLM at the question level, which is precisely the setup the automated-essay-scoring page discusses, and the page now lists it in connected_resources. Not listed on assessment-validity: the plugin ships no agreement study, so the page would be pointing readers at a tool rather than at evidence. Not listed on open-source: that page covers the openness argument, not individual Moodle plugins.'
- resource: context-aideatext
  reviewed: '2026-11-12'
  hosts:
  - socratic-method
  - knowledge-graph
  reason: 'The tool is a working Socratic tutor that refuses to answer for the student, which is what the socratic-method page describes, and its live idea graph is a concrete instance of the semantic network the knowledge-graph page explains; both pages now list it in connected_resources. Not listed on formative-assessment: the tutor deliberately does not grade, so it offers no assessment cycle to point at. Not listed on scaffolding: the questioning is scaffolded, but the page is about fading support structures, and a conversation that never yields an answer is not the same intervention.'
- resource: mindrouter
  reviewed: '2026-11-12'
  hosts:
  - institutional-ai-infrastructure
  - open-source
  reason: 'Running a campus inference gateway on institutional GPUs is the concreteness the open-source page argues for — the licence is Apache-2.0 and the sovereignty claim depends on it — so the page now lists MindRouter in connected_resources. Not listed on governance: that page covers policy and accountability for adopted AI, and this tool is infrastructure rather than a governance instrument, though a hosting-and-devops concept page would be its proper home if one is created.'
- resource: amplify-genai
  reviewed: '2026-11-12'
  hosts:
  - institutional-ai-infrastructure
  - open-source
  reason: 'Amplify is an MIT-licensed platform an institution deploys into its own cloud account, which is the openness argument the open-source page makes in practice; the page now lists it in connected_resources. Not listed on rag: the platform uses retrieval but is not a method the page documents. Not listed on governance: the cost-accounting and per-user-limit features are operational controls, not the policy and accountability questions that page covers. Both infrastructure resources would belong on a future enterprise-AI-hosting concept page, which does not exist yet.'
- resource: vfwa
  reviewed: '2026-11-12'
  hosts:
  - process-oriented-assessment
  - assessment-validity
  reason: 'VFWA is a design for the exact question the process-oriented-assessment page asks, how a written task can produce evidence of reasoning rather than a product, and the model is built on the validity argument the assessment-validity page carries, which is why both host pages now list it in connected_resources. Not listed on oral-assessment: the viva is a bounded safeguard triggered by an unclear link, not an oral assessment format the page is about. Not listed on writing-education: the page is about teaching writing, and the resource is an assessment structure that applies beyond writing.'
- resource: ai-guidance-by-age
  reviewed: '2026-11-12'
  hosts:
  - parents-and-families
  - early-childhood-elementary-ai-education
  reason: 'The guide exists to tell caregivers and educators what AI is developmentally appropriate at which age, which is the question the parents-and-families page asks about homes and the early-childhood page asks about the 0-11 band, so both host pages now list it in connected_resources. Not listed on ai-literacy: that page is about teaching the capability, and this resource is guidance about developmental fit rather than a curriculum. Not listed on cognitive-psychology: that page carries the mechanisms, and the guide is a practical instrument built on them.'
- resource: vibe-coding-center
  reviewed: '2026-11-13'
  hosts:
  - vibe-coding
  reason: 'VCC is a build procedure for the exact activity the vibe-coding page describes — an educator prompting a static tool into existence and judging it by behavior — so that page now lists it in connected_resources. Not listed on ai-literacy: the page teaches the capability as curriculum, and VCC is a how-to for one artifact. Not listed on learning-design: VCC offers design guidance for a website, not a method for designing learning. Not listed on accessibility: the guides include accessibility checks, but the page is about the standard rather than about building sites.'
