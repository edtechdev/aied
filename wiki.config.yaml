# Wiki pipeline configuration - the single source of truth for THIS knowledge
# base's tooling: what the scanners search, which journals are polled, how the
# site is built, and which AI agent runs the scheduled jobs.
#
# Site identity (name, URL, base path, editor, licence, theme) lives in
# `site.config.json`, which the Astro build also reads. Do not duplicate it here.
#
# Read by:
#   tooling/scripts/wiki_config.py     loader + validator (--check, --get, --cap)
#   tooling/scripts/fetch-rss-feeds.py journal feeds
#   tooling/cron/*.md                  the scheduled job prompts
# Validate with: python3 tooling/scripts/wiki_config.py --check

version: 1

# Site identity (name, short name, brand, URL, base path, repo URL, editor,
# licence, theme colours) lives in this file, which the Astro build also reads.
site:
  metadata: site.config.json

# ---------------------------------------------------------------------------
# Where the content lives
#
# Every markdown page sits under ONE content root, so the whole knowledge base
# can be opened as a single vault in Obsidian (or read by any other tool) and so
# this repository can be re-pointed at another topic by editing the root:
#
#   <content root>/<locale>/<collection>/<slug>.md
#
# The content root and the folder holding the DEFAULT locale come from
# `site.config.json` (`content.root`, `content.defaultDir`) because the Astro
# build reads the same two values in src/config/content.ts. Change them there and
# both sides move together; nothing here hardcodes the root again.
#
# The values below are collection names INSIDE a locale folder (and, for the
# non-collection entries, paths relative to the repo root).
# ---------------------------------------------------------------------------
paths:
  articles: articles
  concepts: concepts
  resources: resources          # free tools/collections/instruments a reader can use
  faqs: faqs
  raw_papers: raw/papers          # gitignored: raw full text of each source
  pdf_sources: pdf-sources        # gitignored: original PDFs, never deleted
  registry: concepts.registry.yaml   # concept vocabulary (slug, title, aliases)
  scan_state: log.md              # `scan-complete` anchors that bound each scan
  backlog: AIED-BACKLOG.md        # sources awaiting full text

# ---------------------------------------------------------------------------
# Commands (paths relative to the repo root)
# ---------------------------------------------------------------------------
build:
  # HARD GATES - run in this order before every build/commit. A green build is
  # not a substitute for either gate.
  gates:
    - python3 tooling/scripts/check_concepts.py
    # Typed facet fields are authored directly (tags were retired) and must hold
    # concept slugs from their own registry section.
    - python3 tooling/scripts/validate-facets.py
    - python3 tooling/scripts/gen-concept-artifacts.py --check   # generated views in sync
    - python3 skills/research/wiki-inline-links/scripts/inline_link_scan.py . --all
    - python3 skills/research/wiki-inline-links/scripts/check_list_formatting.py . --all
    # House style is US English: British forms in body prose are a defect.
    - python3 tooling/scripts/check-us-english.py
    # Article page shape: the practice and Limitations sections, their bullet counts
    # (practice 3-5, Limitations 2-4) and the section order, on the pages touched here.
    - python3 tooling/scripts/audit-article-sections.py --changed
    # AI-use / provenance fields: valid values everywhere, and present on pages
    # created on or after the date the per-page fields were introduced (see AI-USE.md).
    - python3 tooling/scripts/check-ai-disclosure.py
    # Per-change provenance: commits should carry AI-Model/AI-Role trailers.
    # Advisory (exit 0) because commits made before the convention cannot be fixed.
    - python3 tooling/scripts/check-ai-disclosure-trailers.py
    # Every number in an article body must appear in that page's raw source. A hit means
    # "investigate", not "fabrication": PDF extraction produces leading-dot and
    # line-broken false positives. Scoped to changed pages so a legacy page's pre-existing
    # token shapes do not block unrelated work.
    - python3 tooling/scripts/verify-number-grounding.py --changed
    # Frontmatter date fields must stay quoted strings: an unquoted ISO timestamp is a
    # YAML date, which the schema normalises to UTC and can shift to the next calendar day.
    - python3 tooling/scripts/check-frontmatter-dates.py
  site: npm run build             # Astro + Pagefind + PWA service worker
  llms: python3 tooling/scripts/generate-llms-files.py
  # Offline books are LOCAL committed artefacts, rebuilt ONLY on explicit
  # request - never automatically after content edits.
  epub: python3 tooling/build-epub.py
  kdp_epub: python3 tooling/build-kdp-epub.py

# ---------------------------------------------------------------------------
# Live preview server (never part of a build; only used to eyeball changes)
#
# The preview is a long-running `astro dev` process. A scheduled scan writes
# content from OUTSIDE that process, so its content cache goes stale and new
# pages 404 on the preview until it is restarted. `refresh-preview.py` detects
# that and restarts it (and the scan prompts call it).
#
# host/port are machine-specific: override them in the gitignored
# `wiki.config.local.yaml` rather than editing this file, so the repository
# stays portable. Example local override:
#     preview:
#       host: 192.168.1.50
# ---------------------------------------------------------------------------
preview:
  mode: preview              # preview = serves dist/ (static, no file watching) | dev = `astro dev` (hot reload)
  host: 127.0.0.1            # override per machine in wiki.config.local.yaml
  port: 4321
  base_path: /aied           # from site.config.json; informational
  log: /tmp/wiki-preview.log # where a restarted server writes its output
  wait_seconds: 60           # how long to wait for HTTP 200 after a restart
  refresh_after: [daily_scan, weekly_scan]   # jobs that call refresh-preview.py

# ---------------------------------------------------------------------------
# The AI agent that runs the pipeline. Everything agent-specific is confined to
# this block so the rest of the tooling stays portable.
# ---------------------------------------------------------------------------
agent:
  name: Hermes                    # e.g. Hermes, Claude Code, Codex, Aider...
  skills_dir: ~/.hermes/skills    # where this agent installs skills (sync target)
  # The pipeline is described in terms of capabilities, never tool names. Map
  # each capability onto the tool YOUR agent provides.
  capabilities:
    run_python: execute_code      # run a Python snippet and read its output
    read_file: read_file
    write_file: write_file
    shell: terminal               # run a shell command / script
    fetch_url: web_extract        # fetch a URL as markdown/text
    search_web: web_search
    delegate: delegate_task       # spawn an isolated sub-agent
    schedule: cronjob_manage      # create/update a recurring job

# ---------------------------------------------------------------------------
# Daily new-paper scan
# ---------------------------------------------------------------------------
scan:
  schedule: "0 9 * * 1-5"         # weekdays 09:00 (repo-local timezone)
  window:
    default_days: 3               # used when no scan-complete anchor exists
    state_key: last_arxiv_scan_date
  sources:
    - name: arXiv CS + education
      type: arxiv_api
      url: "https://export.arxiv.org/api/query"
      categories: [cs.CY, cs.HC, cs.CL, cs.AI]
      keywords: [education, learning, student, teacher, classroom, tutor, school,
                 curriculum, pedagog, grading, feedback, literacy, assessment,
                 metacognit]
      max_results: 20
      # Feed for new articles when the dated API query comes back empty (a weekend,
      # or an outage). These are arXiv's RSS feeds: an API under the same terms of
      # use, and the documented way to get new articles per category. Do NOT scrape
      # the listing pages on the main site — those are for interactive readers.
      # All access goes through tooling/scripts/arxiv_fetch.py (one request per 3s).
      rss_fallback: ["https://rss.arxiv.org/rss/cs.CY",
                     "https://rss.arxiv.org/rss/cs.HC",
                     "https://rss.arxiv.org/rss/cs.CL",
                     "https://rss.arxiv.org/rss/cs.AI"]
    - name: arXiv physics.ed-ph
      type: arxiv_api
      url: "https://export.arxiv.org/api/query"
      categories: [physics.ed-ph]
      keywords: [AI, LLM, chatbot, generative, machine learning]
      max_results: 10
      rss_fallback: ["https://rss.arxiv.org/rss/physics.ed-ph"]
    - name: EdArXiv
      type: web_search
      url: "https://osf.io/preprints/edarxiv/discover"
      query: "AI OR LLM OR generative education learning teaching tutoring"
      max_results: 20
    # PsyArXiv has no RSS feed, and the OSF REST API cannot combine
    # filter[subjects] with any other filter (all combinations return 0), so the
    # discover page's SHARE/Trove search service is used instead. Fetcher:
    # tooling/scripts/fetch-psyarxiv-edpsych.py
    - name: PsyArXiv (Educational Psychology)
      type: trove_search
      url: "https://share.osf.io/trove/index-card-search"
      provider: "https://osf.io/preprints/psyarxiv"
      provider_name: PsyArXiv
      subject_ids: ["https://api.osf.io/v2/subjects/584240d954be81056ceca992"]
      subject_name: Educational Psychology
      access_service: "https://osf.io/"
      fetcher_script: tooling/scripts/fetch-psyarxiv-edpsych.py
      max_results: 60
      max_age_days: 3
  # Applied after retrieval; default_policy wins whenever the call is close.
  relevance_filter:
    include:
      - AI/LLM/generative AI applied to education, learning, or teaching
      - Intelligent tutoring systems, AI feedback, automated grading
      - AI literacy, AI in classrooms, student-AI interaction
      - Learning analytics, knowledge tracing, student modelling
      - AI-generated educational content or assessment
      - AI safety or harms in educational contexts
    exclude:
      - Pure CS/ML research with no education application
      - General AI fairness/ethics without an education context
      - Non-AI education research
      - AI-detection tools without an education context
      # The weekly journal scan has historically been stricter than the daily
      # arXiv scan; these entries come from its live prompt so the config matches
      # what is actually practised.
      - VR/AR without an AI component
      - Metaverse applications without AI
      - Mobile learning and general ed-tech adoption (TAM) without AI
      - Digital competence or literacy work with no AI component
    # NOTE: the daily arXiv scan ingests when the call is close; the weekly
    # journal scan has said "when in doubt, exclude". They disagree on purpose
    # (arXiv preprints are cheap to be broad about). Record the rule you want
    # here per source, or leave this as the tie-break for both.
    default_policy: ingest
  deduplication: doi_or_arxiv_id
  rate_limiting:
    strategy: exponential_backoff
    base_delay: 2
    max_retries: 5
    backoff_multiplier: 2

# ---------------------------------------------------------------------------
# Weekly open-access journal scan
# ---------------------------------------------------------------------------
journal_scan:
  schedule: "0 8 * * 0"           # Sundays 08:00
  fetcher_script: tooling/scripts/fetch-rss-feeds.py   # reads the feeds below
  # Each feed: id (stable key used in the report), parser (which XML shape the
  # feed uses - see tooling/scripts/fetch-rss-feeds.py), url, open_access
  # (true | false | check_per_article) and the freshness cutoff.
  feeds:
    - id: caeai
      name: "Computers and Education: Artificial Intelligence"
      url: "https://rss.sciencedirect.com/publication/science/2666920X"
      parser: parse_caeai
      journal: "Computers and Education: Artificial Intelligence"
      doi_prefix: caeai
      open_access: true
      max_age_days: 90
    - id: ceao
      name: Computers and Education Open
      url: "https://rss.sciencedirect.com/publication/science/26665573"
      parser: parse_caeai
      journal: Computers and Education Open
      doi_prefix: caeo
      open_access: true
      max_age_days: 90
    - id: bjet
      name: British Journal of Educational Technology
      url: "https://bera-journals.onlinelibrary.wiley.com/feed/14678535/most-recent"
      parser: parse_bjet
      open_access: check_per_article   # hybrid journal - verify before ingesting
      max_age_days: 30
    - id: frontiers
      name: Frontiers in Psychology
      url: "https://www.frontiersin.org/journals/psychology/rss"
      parser: parse_frontiers
      open_access: true
      max_age_days: 30
    - id: ijethel
      name: International Journal of Educational Technology in Higher Education
      url: "https://link.springer.com/search.rss?facet-content-type=Article&facet-journal-id=41239"
      parser: parse_springer
      journal: International Journal of Educational Technology in Higher Education
      doi_prefix: ijethel
      open_access: true
      max_age_days: 90
    - id: ijaied
      name: International Journal of Artificial Intelligence in Education
      url: "https://rss.sciencedirect.com/publication/science/15604292"
      parser: parse_caeai
      journal: International Journal of Artificial Intelligence in Education
      doi_prefix: ijaied
      open_access: true
      max_age_days: 90
    # Scholastica-hosted, fully open access (CC BY). The journal covers
    # instructional design and technology across K-12, higher ed, corporate,
    # military and government settings, so most issues are NOT about AI: the
    # weekly scan's relevance filter decides per article, and only AI-related
    # pieces are ingested. It publishes in batches (an issue arrives every few
    # months), hence the longer window: 120 days keeps the whole current issue
    # inside the cutoff between mailings.
    - id: joidat
      name: Journal of Instructional Design and Technology
      url: "https://joidat.scholasticahq.com/feed"
      parser: parse_scholastica
      journal: Journal of Instructional Design and Technology
      source_id: joidat
      open_access: true
      max_age_days: 120
    - id: aalhe
      name: "Intersection: A Journal at the Intersection of Assessment and Learning"
      url: "https://aalhe.scholasticahq.com/feed"
      parser: parse_scholastica
      journal: "Intersection: A Journal at the Intersection of Assessment and Learning"
      source_id: aalhe
      # Broader than AI in education: keep only items about AI or generative AI
      topical_fit: assessment of learning in higher education
      open_access: true
      max_age_days: 120

citation_format: APA

# ---------------------------------------------------------------------------
# Where the scheduled jobs report back
# ---------------------------------------------------------------------------
notification:
  platform: telegram     # or: local (write to the cron output dir only)
  delivery: origin       # deliver to the chat that created the job
