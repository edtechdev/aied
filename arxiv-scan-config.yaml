# AI Ed Wiki — Daily Scan Configuration
# Used by the daily AIED scan cron job (job 9a44c11daec8)
# Matches the live cron prompt (see tooling/references/daily-scan-pipeline.md and cron/daily-scan-prompt.md)

schedule: "0 9 * * 1-5"  # 9:00 AM weekdays, Eastern (per live cron)

search_window:
  default_days: 3  # Fallback when no prior run date in memory
  memory_key: "last_arxiv_scan_date"

sources:
  # --- Source 1: arXiv CS + education ---
  # Primary API:
  #   http://export.arxiv.org/api/query?search_query=all:education+AND+all:artificial+intelligence&sortBy=submittedDate&max_results=20
  # Fallback listing pages (use IMMEDIATELY on HTTP 429/503/empty/timeout):
  #   https://arxiv.org/list/cs.CY/recent
  #   https://arxiv.org/list/cs.HC/recent
  #   https://arxiv.org/list/cs.CL/recent
  #   https://arxiv.org/list/cs.AI/recent
  - name: arXiv CS + education
    type: arxiv_api
    url: "http://export.arxiv.org/api/query"
    query: "all:education AND all:artificial intelligence"
    max_results: 20
    retry: {max_attempts: 3, delay_seconds: 2}
    listing_fallback: ["https://arxiv.org/list/cs.CY/recent", "https://arxiv.org/list/cs.HC/recent",
                       "https://arxiv.org/list/cs.CL/recent", "https://arxiv.org/list/cs.AI/recent"]

  # --- Source 2: arXiv Physics education ---
  # Primary API:
  #   http://export.arxiv.org/api/query?search_query=cat:physics.ed-ph&sortBy=submittedDate&max_results=20
  # Fallback listing page:
  #   https://arxiv.org/list/physics.ed-ph/recent
  # Scope note: skip non-AI physics education papers (mechanics, lab equipment, telescopes) unless they involve AI/LLM.
  - name: arXiv physics.ed-ph
    type: arxiv_api
    url: "http://export.arxiv.org/api/query"
    query: "cat:physics.ed-ph"
    max_results: 20
    retry: {max_attempts: 3, delay_seconds: 2}
    listing_fallback: ["https://arxiv.org/list/physics.ed-ph/recent"]

  # --- Source 3: EdArXiv (Education Preprint Archive, via OSF API) ---
  # ALWAYS pass -g (globoff) to curl so filter[provider]/filter[title] brackets aren't glob-expanded.
  # curl -g -s "https://api.osf.io/v2/preprints/?filter[provider]=edarxiv&filter[title]=artificial+intelligence&sort=-date_modified&page[size]=10"
  # curl -g -s "https://api.osf.io/v2/preprints/?filter[provider]=edarxiv&filter[title]=generative+AI&sort=-date_modified&page[size]=10"
  - name: EdArXiv (OSF)
    type: osf_api
    url: "https://api.osf.io/v2/preprints/"
    provider: "edarxiv"
    title_queries: ["artificial intelligence", "generative AI"]
    sort: "-date_modified"
    page_size: 10
    dedupe: "title_or_doi"  # EdArXiv preprints sometimes appear in arXiv too

wiki:
  path: ./
  concepts_dir: concepts/
  raw_dir: raw/papers/
  static_site_dir: static-site/
  static_site_url: http://localhost:8080

notification:
  platform: telegram
  delivery: origin  # Back to the chat that triggered

relevance_filter:
  include:
    - AI/LLM/genAI applied to education, learning, or teaching
    - Intelligent tutoring systems, AI feedback, automated grading
    - AI literacy, AI in classrooms, student-AI interaction
    - Learning analytics with AI, knowledge tracing, student modeling
    - AI-generated educational content or assessment
    - AI safety/harms in educational contexts
  exclude:
    - Pure CS/ML research with no education application
    - General AI fairness/ethics without education context
    - Non-AI education research
    - AI detection tools without education context
    - Non-AI physics education (mechanics, lab equipment, telescope projects)
  default_policy: "ingest"  # When uncertain, ingest

deduplication:
  method: "arxiv_id_or_doi"
  check_path: "raw/papers/"

rate_limiting:
  strategy: "exponential_backoff"
  base_delay: 2  # seconds
  max_retries: 5
  backoff_multiplier: 2
  jitter: true

citation_format: "APA"
