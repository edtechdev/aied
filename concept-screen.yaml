  - limitations-in-aied-research
  no_change:
  - intelligent-tutoring
  - conversational-ai
  - student-engagement
  - motivation
  reason: 'Accepted two of six pairs. self-efficacy had no randomized test of whether a tool caused the change:
    this supplies the time-effect-versus-treatment-effect caution (time β = 0.099, p = 0.0009; group p = 0.1162;
    interaction p = 0.5306). limitations-in-aied-research stated the speed problem but not the comparability consequence
    (pre-2023 tutoring rests on systems functionally unlike current models; no term-long RAG RCT in undergraduate
    education). Skipped four: each would be another instance of a documented pattern.'
