# Concept-screen record.
#
# One entry per article page created on or after `concept_screen.since` in
# wiki.config.yaml. Ingesting an article is finished only when this entry exists:
# either `integrated:` lists the concept pages that now carry the finding (verified
# against their narrative bodies by tooling/scripts/check-concept-screen.py), or
# `integrated:` is empty and `reason:` records why nothing qualified.
#
# An article that adds another instance of a claim a concept page already carries does
# NOT qualify, however solid the study: the bar is significant AND distinguishing. Most
# entries should have an empty `integrated:` and a reason.

- article: automated-scoring-learning-diagnosis-mechanism-2026
  date: 2026-09-27
  integrated: [formative-assessment, automated-essay-scoring]
  no_change: []
  reason: "Integrated at ingest: comprehension accuracy correlated with actionability and diagnostic accuracy (r = 0.501 > 0.480 > 0.445), and the scoring model reached F1 = 0.824 on vocabulary against 0.579 on claim-evidence alignment."

