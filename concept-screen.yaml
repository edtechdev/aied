  - cognitive-offloading
  - desirable-difficulties
  no_change:
  - retrieval-spacing-interleaving
  - learning-gains
  reason: Accepted two of four pairs. cognitive-offloading's closest evidence was retention at 48 hours and an immediate
    post-test; this adds a randomized 45-day delayed endpoint with an effect size (d = 0.68) and shows the deficit
    survives a study-time covariate (F(1, 82) = 7.89, p = .006), ruling out the saved-time explanation. desirable-difficulties
    gets a direct delayed test in an AI setting, impairment largest on technical material. Skipped retrieval-spacing-interleaving
    (manipulates no retrieval, spacing or interleaving technique) and learning-gains (same-direction instance of
    claims it already carries).
