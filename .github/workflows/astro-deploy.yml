name: Deploy Astro to Pages

# Publishes the site tarball produced by "Build & Verify" instead of
# rebuilding the site a second time: each push builds once, and this job
# only downloads the package and pushes it to Pages.
on:
  workflow_run:
    workflows: ["Build & Verify"]
    types: [completed]
    branches: [main]

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages-astro
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    if: github.event.workflow_run.conclusion == 'success'
    environment:
      name: github-pages
      url: ${{ steps.deploy.outputs.page_url }}
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: built-site
          path: site-package
          run-id: ${{ github.event.workflow_run.id }}
          github-token: ${{ secrets.GITHUB_TOKEN }}
      - name: Extract the built site
        run: |
          tar xzf site-package/site.tar.gz
          test -f dist/index.html
          test -f dist/sw.js
          echo "Extracted $(find dist -name '*.html' | wc -l) HTML files"
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v4
        with:
          path: dist
      - id: deploy
        uses: actions/deploy-pages@v4
