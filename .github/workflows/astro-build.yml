name: Build & Verify

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: 'npm'
      - run: npm ci
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: pip install pyyaml
      - name: Validate config and concept registry
        run: |
          python3 tooling/scripts/wiki_config.py --check
          python3 tooling/scripts/check_concepts.py
      # build:ci skips `astro check` - type-checking runs locally (npm run
      # build), and in CI the time is better spent on the build itself.
      - run: npm run build:ci
      - name: Verify output
        run: |
          echo "Articles built: $(find dist/articles -name 'index.html' | wc -l)"
          echo "Concepts built: $(find dist/concepts -name 'index.html' | wc -l)"
          test -f dist/index.html
          test -f dist/pagefind/pagefind-entry.json
          # PWA: manifest + service worker must be present
          test -f dist/manifest.webmanifest
          test -f dist/sw.js
      - name: Check the deploy artifact fits Pages
        run: |
          # The offline editions must NOT be in the artifact. They are already
          # compressed (a PDF and an EPUB are both containers), so GitHub packs
          # them at full weight: ~161 MB was enough to push the artifact past
          # its 1 GB limit and towards its 10-minute deploy timeout.
          if ls dist/*.epub dist/*.pdf >/dev/null 2>&1; then
            echo "::error::dist/ still contains offline editions - astro.config.mjs stripOfflineEditions() did not run"
            ls dist/*.epub dist/*.pdf
            exit 1
          fi
          # Report the size GitHub will upload and fail before Pages does.
          # Measured by gzip-packing dist, the same way upload-pages-artifact does.
          BYTES=$(tar czf - dist | wc -c)
          echo "Deploy artifact (gzip): $BYTES bytes"
          # GitHub's limit is 1 GiB (1073741824). Fail at 1 GB to leave room for
          # the packer's own overhead, and so a regression is caught here rather
          # than as a Pages timeout after an 8-minute deploy.
          if [ "$BYTES" -gt 1000000000 ]; then
            echo "::error::deploy artifact is $BYTES bytes - over 1 GB, Pages will warn and may time out"
            exit 1
          fi
      - name: Package the built site for the deploy job
        run: |
          # One tarball per push; the deploy workflow downloads and publishes
          # this instead of rebuilding the site a second time.
          tar czf site.tar.gz dist
          SIZE=$(stat -c %s site.tar.gz)
          echo "Packaged site: $SIZE bytes"
          # Keep headroom under the 1 GiB upload-pages-artifact cap enforced
          # above; upload-artifact itself permits up to 2 GB per artifact.
          if [ "$SIZE" -gt 1000000000 ]; then
            echo "::error::site package is $SIZE bytes - over the 1 GB Pages cap, split or trim before continuing"
            exit 1
          fi
      - uses: actions/upload-artifact@v4
        with:
          name: built-site
          path: site.tar.gz
          retention-days: 7
          if-no-files-found: error
