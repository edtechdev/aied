name: Build & Verify

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: 'npm'
      - run: npm ci
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: pip install pyyaml
      - name: Run build tooling tests
        run: python3 -m unittest discover -s tooling/tests -p 'test_*.py' -v
      - name: Validate config and concept registry
        run: |
          python3 tooling/scripts/wiki_config.py --check
          python3 tooling/scripts/check_concepts.py
      # build:ci skips `astro check` - type-checking runs locally (npm run
      # build), and in CI the time is better spent on the build itself.
      - run: npm run build:ci
      - name: Verify output
        run: |
          echo "Articles built: $(find dist/articles -name 'index.html' | wc -l)"
          echo "Concepts built: $(find dist/concepts -name 'index.html' | wc -l)"
          test -f dist/index.html
          test -f dist/pagefind/pagefind-entry.json
          # PWA: manifest + service worker must be present
          test -f dist/manifest.webmanifest
          test -f dist/sw.js
      - name: Report build size
        id: size
        # Keep the report even when the reporter itself finds an invalid
        # output tree or (in enforce mode) the blocking budget. A later step
        # turns a failure into a job failure after the report uploads.
        continue-on-error: true
        run: |
          rm -rf reports/build-size
          python3 tooling/scripts/report-build-size.py \
            --dist dist \
            --config tooling/build-size-budget.json \
            --out reports/build-size \
            --mode report
      - name: Append build-size summary
        if: always() && hashFiles('reports/build-size/summary.md') != ''
        run: cat reports/build-size/summary.md >> "$GITHUB_STEP_SUMMARY"
      - name: Upload build-size report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: build-size-report
          path: reports/build-size
          retention-days: 7
          if-no-files-found: error
      - name: Fail if the build-size report is invalid
        if: steps.size.outcome == 'failure'
        run: exit 1
      # One packaging operation, one Pages artifact. The deploy job only
      # deploys this named artifact; it never downloads, extracts, or re-tars.
      - name: Upload Pages artifact
        if: github.event_name == 'push' && github.ref == 'refs/heads/main' && steps.size.outcome == 'success'
        uses: actions/upload-pages-artifact@v4
        with:
          path: dist
          name: github-pages
          retention-days: 1

  deploy:
    needs: build
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    concurrency:
      group: pages-astro
      cancel-in-progress: true
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
        with:
          artifact_name: github-pages
