name: Build & Verify

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v5
        with:
          # Two commits are enough for the common single-commit push; the gate step
          # fetches the exact base commit when the push is longer.
          fetch-depth: 2
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: pip install pyyaml
      - name: Run build tooling tests
        run: python3 -m unittest discover -s tooling/tests -p 'test_*.py' -v
      # The gate suite diffs the WORKING TREE against HEAD, so a fresh checkout shows
      # nothing and every diff-scoped gate would report "no pages in scope" and pass.
      # Resetting HEAD to the commit this push started from makes the pushed content
      # look like an uncommitted change set — the same shape the suite is run in
      # locally — so section, grounding, disclosure, evidence-context, first-mention,
      # created-date and parity gates all see this push's pages.
      - name: Resolve gate base
        id: gatebase
        env:
          EVENT: ${{ github.event_name }}
          BEFORE: ${{ github.event.before }}
        run: |
          set -euo pipefail
          if [ "$EVENT" = "pull_request" ]; then
            # actions/checkout checks out the synthetic merge commit; its first
            # parent is the base branch tip, so the diff against it is the PR.
            rev="HEAD^1"
          else
            rev="$BEFORE"
            if [ -z "$rev" ] || [ "$rev" = "0000000000000000000000000000000000000000" ]; then
              rev="HEAD^1"
            fi
            if ! git cat-file -e "${rev}^{commit}" 2>/dev/null; then
              git fetch --no-tags --depth=1 origin "$rev" || git fetch --no-tags --deepen=50 origin || true
            fi
          fi
          if ! git cat-file -e "${rev}^{commit}" 2>/dev/null; then
            echo "::error::Cannot resolve gate base '$rev'. Refusing to run a suite that would check nothing."
            exit 1
          fi
          echo "rev=$rev" >> "$GITHUB_OUTPUT"
          echo "Gate base: $rev ($(git rev-parse --short "$rev"))"
      - name: Run content gates
        timeout-minutes: 10
        run: |
          git reset --mixed "${{ steps.gatebase.outputs.rev }}"
          # --cold: a fresh checkout has no cache, and a cache must never decide CI.
          python3 tooling/scripts/run-gates.py --changed --cold
      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: 'npm'
      - run: npm ci
      # build:ci skips `astro check` - type-checking runs locally (npm run
      # build), and in CI the time is better spent on the build itself.
      - run: npm run build:ci
      - name: Verify output
        run: |
          echo "Articles built: $(find dist/articles -name 'index.html' | wc -l)"
          echo "Concepts built: $(find dist/concepts -name 'index.html' | wc -l)"
          test -f dist/index.html
          test -f dist/pagefind/pagefind-entry.json
          # PWA: manifest + service worker must be present
          test -f dist/manifest.webmanifest
          test -f dist/sw.js
      - name: Report build size
        id: size
        # Keep the report even when the reporter itself finds an invalid
        # output tree or (in enforce mode) the blocking budget. A later step
        # turns a failure into a job failure after the report uploads.
        continue-on-error: true
        run: |
          rm -rf reports/build-size
          python3 tooling/scripts/report-build-size.py \
            --dist dist \
            --config tooling/build-size-budget.json \
            --out reports/build-size \
            --mode report
      - name: Append build-size summary
        if: always() && hashFiles('reports/build-size/summary.md') != ''
        run: cat reports/build-size/summary.md >> "$GITHUB_STEP_SUMMARY"
      - name: Upload build-size report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: build-size-report
          path: reports/build-size
          retention-days: 7
          if-no-files-found: error
      - name: Fail if the build-size report is invalid
        if: steps.size.outcome == 'failure'
        run: exit 1
      # One packaging operation, one Pages artifact. The deploy job only
      # deploys this named artifact; it never downloads, extracts, or re-tars.
      - name: Upload Pages artifact
        if: github.event_name == 'push' && github.ref == 'refs/heads/main' && steps.size.outcome == 'success'
        uses: actions/upload-pages-artifact@v4
        with:
          path: dist
          name: github-pages
          retention-days: 1

  deploy:
    needs: build
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    concurrency:
      group: pages-astro
      cancel-in-progress: true
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
        with:
          artifact_name: github-pages
          # The 1.7 GB dist tree can take GitHub Pages longer than the
          # action's 10-minute default to sync; three consecutive runs were
          # cancelled at "deployment_in_progress" while the site was healthy.
          timeout: 1200000
