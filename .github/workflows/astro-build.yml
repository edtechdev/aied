name: Build & Verify

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: 'npm'
      - run: npm ci
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: pip install pyyaml
      - name: Validate config and concept registry
        run: |
          python3 tooling/scripts/wiki_config.py --check
          python3 tooling/scripts/check_concepts.py
      - run: npm run build
      - name: Verify output
        run: |
          echo "Articles built: $(find dist/articles -name 'index.html' | wc -l)"
          echo "Concepts built: $(find dist/concepts -name 'index.html' | wc -l)"
          test -f dist/index.html
          test -f dist/pagefind/pagefind-entry.json
          # PWA: manifest + service worker must be present
          test -f dist/manifest.webmanifest
          test -f dist/sw.js