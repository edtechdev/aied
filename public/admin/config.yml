        field: { name: id, label: Id, widget: string }
      - name: ai_assist
        label: AI assistance
        widget: list
        required: false
        hint: "Ordered record of AI contributions to the current text, newest last."
        fields:
          - { name: model, label: Model, widget: string }
          - name: role
            label: Role
            widget: select
            options: [drafting, revision, link classification, summarization, translation, none]
          - { name: date, label: Date, widget: datetime, type: date, required: false }
          - { name: agent, label: Agent, widget: string, required: false }
      - name: source_depth
        label: Source depth
        widget: select
        multiple: true
        required: false
        hint: "How much of the source the page was written from."
        options:
          - full text
          - abstract only
          - metadata only
      - name: verified
