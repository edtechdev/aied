# yaml-language-server: $schema=https://unpkg.com/@sveltia/cms@0.266.0/schema/sveltia-cms.json

# Sveltia CMS configuration for the AI in Education knowledge base.
# Site: Astro (static), GitHub Pages at https://edtechdev.github.io/aied/
# Admin is served at /aied/admin/ (public/admin in this repo).
#
# The field lists below mirror src/content.config.ts. When the schema changes,
# change this file in the same commit: an editor writing a value the build
# rejects is worse than an editor that cannot offer the field at all.

# NOTE ON EDITING MODEL
# Body fields use the richtext (rich_text + raw markdown) widget. A custom
# wikilink editor component (registered in index.html) renders [[slug]] /
# [[slug|label]] as inline chips in rich-text mode, while raw mode preserves the
# wiki's strict markdown conventions (single-block ordered lists, ## heading
# structure, blockquotes). created/updated are hidden but retained.

# OPEN AUTHORING: visitors with no write access sign in with GitHub, are offered
# a fork of edtechdev/aied in their own account, edit there, and submit a pull
# request. Nothing is written to main until a maintainer merges the PR on GitHub.
# Editorial workflow (PR-per-entry) is required for this. auth_scope public_repo
# keeps the OAuth grant narrow for a public repo.
publish_mode: editorial_workflow

backend:
  name: github
  repo: edtechdev/aied
  branch: main
  open_authoring: true
  auth_scope: public_repo
  base_url: https://sveltia-cms-auth.aiedkb.workers.dev

# We have no content media folders; concepts and FAQs are text-only.
# media_folder is still required (internal storage is on by default). Uploads
# would land in public/uploads and resolve at /uploads.
media_folder: /public/uploads
public_folder: /uploads

output:
  yaml:
    quote: none # keep frontmatter unquoted where YAML allows, as in current files

collections:
  - name: articles
    label: Articles
    label_singular: Article
    folder: /content/en/articles
    extension: md
    format: frontmatter
    summary: "{{title}} — {{confidence | default('medium')}}"
    identifier_field: title
    sortable_fields: [title]
    fields:
      - { name: title, label: Title, widget: string }
      - { name: created, widget: hidden }
      - { name: updated, widget: hidden }
      - { name: type, widget: hidden }
      # The paper's own publication date, distinct from created (the ingestion date).
      - { name: published, label: Published, widget: string, required: false, hint: "Date the PAPER was published: YYYY-MM-DD, YYYY-MM or YYYY. Never invent a day; leave blank if unknown." }
      - { name: evidence_context, label: Research context, widget: select, options: [educational, non_educational, mixed], required: false, hint: "educational = the study measured education directly; non_educational = the implications are inferred from another setting; mixed = both were studied." }
      - name: confidence
        label: Confidence
        widget: select
        required: false
        options:
          - high
          - medium
          - low
      - name: audience
        label: Audience
        widget: select
        multiple: true
        required: false
        options:
          - administrators
          - assessment designers
          - assessment professionals
          - curriculum designers
          - educational technology developers
          - faculty developers
          - institutions
          - instructional designers
          - instructors
          - learners
          - learning analytics designers
          - librarians
          - medical educators
          - parents and families
          - policymakers
          - researchers
          - software developers
      - name: level
        label: Level
        widget: select
        multiple: true
        required: false
        options:
          - adult learning
          - graduate
          - higher ed
          - k 12
          - middle school
          - preschool
          - primary education
          - secondary
          - special education
          - teacher education
          - undergraduate
      - name: page_kind
        label: Page kind
        widget: select
        multiple: true
        required: false
        hint: "What the page contributes. Design case = a course, workshop or activity sequence described and reflected on; implementation = a working system, tool or deployed artifact; commentary = an editorial, opinion piece or position paper whose contribution is the stance."
        options:
          - framework
          - synthesis
          - evaluation
          - design case
          - implementation
          - commentary
      - name: research_method
        label: Research method
        widget: select
        multiple: true
        required: false
        options:
          - action design research
          - bibliometric
          - case study
          - delphi
          - design and evaluation study
          - experiment
          - instrument development
          - interviews
          - latent profile analysis
          - literature review
          - longitudinal study
          - network analysis
          - policy analysis
          - position paper
          - process-outcome modeling
          - quasi-experiment
