      - { name: authors, widget: hidden }
      - { name: venue, widget: hidden }
      - { name: equity_ethics, widget: hidden }
      - { name: translation_of, widget: hidden }
      - name: body
        label: Body
        widget: richtext
        modes: [rich_text, raw]

