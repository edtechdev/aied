# yaml-language-server: $schema=https://unpkg.com/@sveltia/cms/schema/sveltia-cms.json

# Sveltia CMS configuration for the AI in Education knowledge base.
# Site: Astro (static), GitHub Pages at https://edtechdev.github.io/aied/
# Admin is served at /aied/admin/ (public/admin in this repo).

# NOTE ON EDITING MODEL
# Body fields use the richtext (rich_text + raw markdown) widget. A custom
# wikilink editor component (registered in index.html) renders [[slug]] /
# [[slug|label]] as inline chips in rich-text mode, while raw mode preserves the
# wiki's strict markdown conventions (single-block ordered lists, ## heading
# structure, blockquotes). created/updated are hidden but retained.

# OPEN AUTHORING: visitors with no write access sign in with GitHub, are offered
# a fork of edtechdev/aied in their own account, edit there, and submit a pull
# request. Nothing is written to main until a maintainer merges the PR on GitHub.
# Editorial workflow (PR-per-entry) is required for this. auth_scope public_repo
# keeps the OAuth grant narrow for a public repo.
publish_mode: editorial_workflow

backend:
  name: github
  repo: edtechdev/aied
  branch: main
  open_authoring: true
  auth_scope: public_repo
  base_url: https://sveltia-cms-auth.doug-holton.workers.dev

# We have no content media folders; concepts and FAQs are text-only.
# media_folder is still required (internal storage is on by default). Uploads
# would land in public/uploads and resolve at /uploads.
media_folder: /public/uploads
public_folder: /uploads

output:
  yaml:
    quote: none # keep frontmatter unquoted where YAML allows, as in current files

collections:
  # ---------------------------------------------------------------------------
  # ARTICLES
  # ---------------------------------------------------------------------------
  - name: articles
    label: Articles
    label_singular: Article
    folder: /articles
    extension: md
    format: frontmatter
    summary: "{{title}} — {{confidence | default('medium')}}"
    identifier_field: title
    sortable_fields: [title]
    fields:
      - { name: title, label: Title, widget: string }
      - { name: created, widget: hidden }
      - { name: updated, widget: hidden }
      - { name: type, widget: hidden }
      # tags must be real concept slugs (enforced by src/content.config.ts)
      - name: tags
        label: Tags
        widget: relation
        collection: concepts
        multiple: true
        value_field: "{{slug}}"
        display_fields: [title]
        search_fields: [title]
        required: false
      # sources is ingestion-managed (raw/papers/<slug>.md); preserved, not editable
      - name: sources
        widget: hidden
      - name: source_url
        label: Source URL
        widget: string
        required: false
      - name: confidence
        label: Confidence
        widget: select
        options: [high, medium, low]
        required: false
      - name: audience
        label: Audience
        widget: select
        multiple: true
        options: [administrators, assessment designers, assessment professionals, curriculum designers, designers, edtech designers, educators, faculty development, institutions, instructional designers, instructors, learners, learning analytics designers, learning designers, medical educators, policymakers, researchers, software developers, students, teacher educators, teachers]
        required: false
      - name: level
        label: Level
        widget: select
        multiple: true
        options: [adult learning, early childhood, elementary, higher ed, k 12, secondary, special education, teacher training]
        required: false
      - name: category
        label: Category
        widget: select
        multiple: true
        options: [ai foundations, assessment, collaborative learning, curriculum design, design thinking, engagement, equity, evaluation, framework, instructional design, policy, synthesis]
        required: false
      - name: research_method
        label: Research Method
        widget: select
        multiple: true
        options: [action design research, benchmark, bibliometric, case study, delphi, design and evaluation study, design-based research, educational measurement, experiment, instrument development, interviews, learning analytics, literature review, longitudinal, longitudinal study, longitudinal survey, meta-analysis, mixed methods, policy analysis, position paper, process-outcome modeling, qualitative, quantitative, quasi-experiment, randomized controlled trial, research methods, secondary analysis, structural equation modeling, survey, system development, systematic review, thematic analysis, theoretical analysis, user study]
        required: false
      - name: discipline
        label: Discipline
        widget: select
        multiple: true
        options: [biology education, business education, chemistry education, cs education, engineering education, english education, humanities education, information technology, language learning, learning analytics, learning sciences, math education, medical education, physics education, science education, stem education, writing education]
        required: false
      # 'body' is stored below the frontmatter block as verbatim Markdown.
      - name: body
        label: Body
        widget: richtext
        modes: [rich_text, raw]

  # ---------------------------------------------------------------------------
  # CONCEPTS
  # ---------------------------------------------------------------------------
  - name: concepts
    label: Concepts
    label_singular: Concept
    folder: /concepts
    extension: md
    format: frontmatter
    summary: "{{title}} — {{confidence | default('medium')}}"
    identifier_field: title
    sortable_fields: [title]
    fields:
      - { name: title, label: Title, widget: string }
      - { name: created, widget: hidden }
      - { name: updated, widget: hidden }
      - { name: type, widget: hidden }
      # tags must be real concept slugs (enforced by src/content.config.ts)
      - name: tags
        label: Tags
        widget: relation
        collection: concepts
        multiple: true
        value_field: "{{slug}}"
        display_fields: [title]
        search_fields: [title]
        required: false
      - name: audience
        label: Audience
        widget: select
        multiple: true
        options: [administrators, assessment designers, assessment professionals, curriculum designers, designers, edtech designers, educators, faculty development, institutions, instructional designers, instructors, learners, learning analytics designers, learning designers, medical educators, policymakers, researchers, software developers, students, teacher educators, teachers]
        required: false
      - name: level
        label: Level
        widget: select
        multiple: true
        options: [adult learning, early childhood, elementary, higher ed, k 12, secondary, special education, teacher training]
        required: false
      - name: category
        label: Category
        widget: select
        multiple: true
        options: [ai foundations, assessment, collaborative learning, curriculum design, design thinking, engagement, equity, evaluation, framework, instructional design, policy, synthesis]
        required: false
      - name: research_method
        label: Research Method
        widget: select
        multiple: true
        options: [action design research, benchmark, bibliometric, case study, delphi, design and evaluation study, design-based research, educational measurement, experiment, instrument development, interviews, learning analytics, literature review, longitudinal, longitudinal study, longitudinal survey, meta-analysis, mixed methods, policy analysis, position paper, process-outcome modeling, qualitative, quantitative, quasi-experiment, randomized controlled trial, research methods, secondary analysis, structural equation modeling, survey, system development, systematic review, thematic analysis, theoretical analysis, user study]
        required: false
      - name: discipline
        label: Discipline
        widget: select
        multiple: true
        options: [biology education, business education, chemistry education, cs education, engineering education, english education, humanities education, information technology, language learning, learning analytics, learning sciences, math education, medical education, physics education, science education, stem education, writing education]
        required: false
      # connected_faqs must reference EXISTING FAQ pages only — enforced by a
      # relation to the faqs collection (value = FAQ slug = filename)
      - name: connected_faqs
        label: Connected FAQs
        widget: relation
        collection: faqs
        multiple: true
        value_field: "{{slug}}"
        display_fields: [title]
        search_fields: [title]
        required: false
      - name: confidence
        label: Confidence
        widget: select
        options: [high, medium, low]
        required: false
      # 'body' is stored below the frontmatter block as verbatim Markdown.
      - name: body
        label: Body
        widget: richtext
        modes: [rich_text, raw]

  # ---------------------------------------------------------------------------
  # FAQs
  # ---------------------------------------------------------------------------
  - name: faqs
    label: FAQs
    label_singular: FAQ
    folder: /faqs
    extension: md
    format: frontmatter
    summary: "{{title}} — {{weight}}"
    identifier_field: title
    sortable_fields: [weight, title]
    fields:
      - { name: title, label: Title, widget: string }
      - { name: created, widget: hidden }
      - { name: updated, widget: hidden }
      - { name: type, widget: hidden }
      - name: weight
        label: Weight (sort order, higher = later)
        widget: number
        required: false
      - name: tags
        label: Tags
        widget: relation
        collection: concepts
        multiple: true
        value_field: "{{slug}}"
        display_fields: [title]
        search_fields: [title]
        required: false
      - name: category
        label: Category
        widget: select
        multiple: true
        options: [ai foundations, assessment, collaborative learning, curriculum design, design thinking, engagement, equity, evaluation, framework, instructional design, policy, synthesis]
        required: false
      - name: audience
        label: Audience
        widget: select
        multiple: true
        options: [administrators, assessment designers, assessment professionals, curriculum designers, designers, edtech designers, educators, faculty development, institutions, instructional designers, instructors, learners, learning analytics designers, learning designers, medical educators, policymakers, researchers, software developers, students, teacher educators, teachers]
        required: false
      - name: level
        label: Level
        widget: select
        multiple: true
        options: [adult learning, early childhood, elementary, higher ed, k 12, secondary, special education, teacher training]
        required: false
      - name: research_method
        label: Research Method
        widget: select
        multiple: true
        options: [action design research, benchmark, bibliometric, case study, delphi, design and evaluation study, design-based research, educational measurement, experiment, instrument development, interviews, learning analytics, literature review, longitudinal, longitudinal study, longitudinal survey, meta-analysis, mixed methods, policy analysis, position paper, process-outcome modeling, qualitative, quantitative, quasi-experiment, randomized controlled trial, research methods, secondary analysis, structural equation modeling, survey, system development, systematic review, thematic analysis, theoretical analysis, user study]
        required: false
      # 'body' is stored below the frontmatter block as verbatim Markdown.
      - name: body
        label: Body
        widget: richtext
        modes: [rich_text, raw]
