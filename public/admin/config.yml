# yaml-language-server: $schema=https://unpkg.com/@sveltia/cms/schema/sveltia-cms.json

# Sveltia CMS configuration for the AI in Education knowledge base.
# Site: Astro (static), GitHub Pages at https://edtechdev.github.io/aied/
# Admin is served at /aied/admin/ (public/admin in this repo).

# NOTE ON EDITING MODEL
# This CMS is configured for EDITING EXISTING concept and FAQ pages via a
# verbatim (raw) Markdown body field, to preserve the wiki's strict markdown
# conventions ([[wikilinks]], single-block ordered lists, ## heading structure).
# It intentionally does NOT expose article ingestion fields (sources, raw paths)
# and does not offer a rich-text editor. created/updated are hidden but retained.

# OPEN AUTHORING: visitors with no write access sign in with GitHub, are offered
# a fork of edtechdev/aied in their own account, edit there, and submit a pull
# request. Nothing is written to main until a maintainer merges the PR on GitHub.
# Editorial workflow (PR-per-entry) is required for this. auth_scope public_repo
# keeps the OAuth grant narrow for a public repo.
publish_mode: editorial_workflow

backend:
  name: github
  repo: edtechdev/aied
  branch: main
  open_authoring: true
  auth_scope: public_repo
  base_url: https://sveltia-cms-auth.doug-holton.workers.dev

# We have no content media folders; concepts and FAQs are text-only.
# (Set media_folder/public_folder later if image uploads are ever wanted.)

output:
  yaml:
    quote: none # keep frontmatter unquoted where YAML allows, as in current files

collections:
  # ---------------------------------------------------------------------------
  # CONCEPTS
  # ---------------------------------------------------------------------------
  - name: concepts
    label: Concepts
    label_singular: Concept
    folder: /concepts
    extension: md
    format: frontmatter
    summary: "{{title}} — {{confidence | default('medium')}}"
    identifier_field: title
    sortable_fields: [title]
    fields:
      - { name: title, label: Title, widget: string }
      - { name: created, widget: hidden }
      - { name: updated, widget: hidden }
      - { name: type, widget: hidden }
      # tags must be real concept slugs (enforced by src/content.config.ts)
      - name: tags
        label: Tags
        widget: relation
        collection: concepts
        multiple: true
        value_field: "{{slug}}"
        display_fields: [title]
        search_fields: [title]
        required: false
      - name: audience
        label: Audience
        widget: list
        required: false
      - name: level
        label: Level
        widget: list
        required: false
      - name: category
        label: Category
        widget: list
        required: false
      - name: research_method
        label: Research Method
        widget: list
        required: false
      - name: discipline
        label: Discipline
        widget: list
        required: false
      - name: connected_faqs
        label: Connected FAQs
        widget: list
        required: false
      - name: confidence
        label: Confidence
        widget: select
        options: [high, medium, low]
        required: false
      # 'body' is stored below the frontmatter block as verbatim Markdown.
      - name: body
        label: Body
        widget: text

  # ---------------------------------------------------------------------------
  # FAQs
  # ---------------------------------------------------------------------------
  - name: faqs
    label: FAQs
    label_singular: FAQ
    folder: /faqs
    extension: md
    format: frontmatter
    summary: "{{title}} — {{weight}}"
    identifier_field: title
    sortable_fields: [weight, title]
    fields:
      - { name: title, label: Title, widget: string }
      - { name: created, widget: hidden }
      - { name: updated, widget: hidden }
      - { name: type, widget: hidden }
      - name: weight
        label: Weight (sort order, higher = later)
        widget: number
        required: false
      - name: tags
        label: Tags
        widget: relation
        collection: concepts
        multiple: true
        value_field: "{{slug}}"
        display_fields: [title]
        search_fields: [title]
        required: false
      - name: category
        label: Category
        widget: list
        required: false
      - name: audience
        label: Audience
        widget: list
        required: false
      - name: level
        label: Level
        widget: list
        required: false
      - name: research_method
        label: Research Method
        widget: list
        required: false
      # 'body' is stored below the frontmatter block as verbatim Markdown.
      - name: body
        label: Body
        widget: text
