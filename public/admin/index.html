<!DOCTYPE html>
<html>
  <head>
    <meta charset="utf-8" />
    <meta name="robots" content="noindex" />
    <title>Sveltia CMS</title>
  </head>
  <body>
    <script src="https://unpkg.com/@sveltia/cms/dist/sveltia-cms.js"></script>
    <script>
      // Wiki-link editing. The [[...]] syntax carries no type marker, so exactly
      // ONE component owns the [[...]] pattern and renders every existing link
      // (bound to the concepts relation for autocomplete). The article and FAQ
      // entries are insert-menu-only: they give the right scoped autocomplete
      // when inserting a link, but their patterns never match body content, so
      // they never hijack rendering of existing links.
      //
      // Trade-off: every existing link renders/edits through the concept picker,
      // since the markdown cannot tell a concept from an article/FAQ link. The
      // article/FAQ menu items exist so insertion is scoped correctly.
      function wikiLink(id, label, icon, collection, matchExisting) {
        CMS.registerEditorComponent({
          id: id,
          label: label,
          icon: icon,
          mode: 'dialog',
          summary: '{{label || slug}}',
          fields: [
            {
              name: 'slug',
              label: 'Slug',
              widget: 'relation',
              collection: collection,
              value_field: '{{slug}}',
              display_fields: ['title'],
              search_fields: ['title'],
            },
            { name: 'label', label: 'Display text (optional)' },
          ],
          // Only the concept component matches existing [[...]] links. The
          // article/FAQ components carry a sentinel pattern that never appears
          // in a body, so they are purely insert tools.
          pattern: matchExisting
            ? /\[\[(?<slug>[^\]|]+?)(?:\|(?<label>[^\]]*?))?\]\]/
            : /\[\[__never_match__(?<slug>.*?)\]\]/,
          fromBlock: ({ groups: { slug, label } = {} }) => ({ slug: slug, label: label || '' }),
          toBlock: ({ slug, label }) => (label ? `[[${slug}|${label}]]` : `[[${slug}]]`),
          toPreview: ({ slug, label }) => `<span>[[${label || slug}]]</span>`,
        });
      }
      // Renders every existing [[...]] link; also available in the insert menu.
      wikiLink('wikilink', 'Wiki Link', 'link', 'concepts', true);
      // Insert-menu entries with scoped autocomplete; never match existing links.
      wikiLink('wikilink-article', 'Wiki Link: Article', 'description', 'articles', false);
      wikiLink('wikilink-faq', 'Wiki Link: FAQ', 'help', 'faqs', false);
    </script>
  </body>
</html>
