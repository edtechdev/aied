<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 96 96" fill="none" role="img" aria-label="AI Ed Wiki">
  <!-- Dark rounded square background (matches site theme) -->
  <rect x="0" y="0" width="96" height="96" rx="22" fill="#0d1418" />
  <rect x="1" y="1" width="94" height="94" rx="21" fill="none" stroke="#2c3a45" stroke-width="1.5" />

  <!-- Hub spokes: center to each outer node -->
  <g stroke="#2c3a45" stroke-width="1.5">
    <line x1="48" y1="48" x2="48" y2="14" />
    <line x1="48" y1="48" x2="82" y2="48" />
    <line x1="48" y1="48" x2="48" y2="82" />
    <line x1="48" y1="48" x2="14" y2="48" />
    <line x1="48" y1="48" x2="72" y2="24" />
    <line x1="48" y1="48" x2="72" y2="72" />
    <line x1="48" y1="48" x2="24" y2="72" />
    <line x1="48" y1="48" x2="24" y2="24" />
  </g>

  <!-- Outer concept nodes (light-blue rounded squares, like the concept map) -->
  <g fill="#7dd3fc">
    <rect x="38" y="5" width="20" height="18" rx="5" />
    <rect x="73" y="39" width="20" height="18" rx="5" />
    <rect x="38" y="73" width="20" height="18" rx="5" />
    <rect x="3" y="39" width="20" height="18" rx="5" />
    <rect x="65" y="17" width="14" height="14" rx="4" />
    <rect x="65" y="65" width="14" height="14" rx="4" />
    <rect x="17" y="65" width="14" height="14" rx="4" />
    <rect x="17" y="17" width="14" height="14" rx="4" />
  </g>

  <!-- Center node (light-blue pill) with AIEd -->
  <rect x="26" y="38" width="44" height="20" rx="10" fill="#7dd3fc" />
  <text x="48" y="52" text-anchor="middle" font-family="inherit" font-size="12" font-weight="700" fill="#0b1220">AIEd</text>
</svg>
